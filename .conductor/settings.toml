"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "npm ci"
run_mode = "concurrent"

[scripts.run.app]
available_in = ["local"]
command = 'npm run serve -- --host 127.0.0.1 --port "${CONDUCTOR_PORT:-3000}" --no-open'
default = true
icon = "play"

[scripts.run.benchmark]
available_in = ["local"]
command = 'PORT=$((${CONDUCTOR_PORT:-3000} + 1)) npm run benchmark:serve'
icon = "gauge"
