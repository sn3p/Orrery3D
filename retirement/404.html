<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orrery3D has moved</title>
    <meta name="description" content="Orrery3D has moved into Orrery, alongside the original 2D view.">
    <link rel="canonical" href="https://sn3p.github.io/Orrery/?renderer=three">
    <style>
      :root {
        color-scheme: dark;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        color: #d7d7d7;
        background: #000;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 0;
        min-height: 100vh;
        margin: 0;
        padding: 16px;
        display: grid;
        place-items: center;
      }

      main {
        width: min(100%, 620px);
        padding: 34px;
        border: 1px solid #4b4b4b;
        background: #0a0a0a;
      }

      h1 {
        margin: 0;
        color: #fff;
        font-size: clamp(22px, 4vw, 28px);
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 1.15;
      }

      p {
        margin: 14px 0 0;
        color: #aaa;
        font-size: 14px;
        line-height: 1.65;
      }

      nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 28px;
      }

      a {
        min-width: 0;
        padding: 18px;
        border: 1px solid #3d3d3d;
        color: #d0d0d0;
        background: #101010;
        text-decoration: none;
      }

      a:first-child {
        border-color: #737373;
        background: #151515;
      }

      a:hover {
        border-color: #aaa;
        color: #fff;
        background: #191919;
      }

      a:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }

      span, strong { display: block; }

      .mode {
        color: #8f8f8f;
        font-size: 10px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      strong {
        margin-top: 8px;
        color: inherit;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.35;
      }

      .renderer {
        margin-top: 18px;
        color: #888;
        font-size: 11px;
      }

      @media (max-width: 480px) {
        body { padding: 12px; }
        main { padding: 28px 20px 20px; }
        nav { grid-template-columns: 1fr; margin-top: 22px; }
        a { padding: 14px 16px; }
        .renderer { margin-top: 10px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Orrery3D has moved</h1>
      <p>This page is no longer available. Choose a view in Orrery instead.</p>
      <nav aria-label="Open Orrery">
        <a href="https://sn3p.github.io/Orrery/?renderer=three">
          <span class="mode">3D view</span>
          <strong>Open Orrery in 3D</strong>
          <span class="renderer">Three.js renderer <span aria-hidden="true">↗</span></span>
        </a>
        <a href="https://sn3p.github.io/Orrery/">
          <span class="mode">2D view</span>
          <strong>Open Orrery in 2D</strong>
          <span class="renderer">Pixi.js renderer <span aria-hidden="true">↗</span></span>
        </a>
      </nav>
    </main>
  </body>
</html>
