<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orrery3D has moved</title>
    <meta name="description" content="Orrery3D has moved into Orrery, alongside the original 2D view.">
    <link rel="canonical" href="https://sn3p.github.io/Orrery/?renderer=three">
    <style>
      :root {
        color-scheme: dark;
        font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 16px;
        line-height: 1.6;
        color: #d4d4d4;
        background: #000;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 0;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 18% 24%, #2b2b2b 0 1px, transparent 1.5px),
          radial-gradient(circle at 78% 68%, #222 0 1px, transparent 1.5px),
          #000;
        background-size: 173px 173px, 239px 239px;
      }

      main {
        min-width: 0;
        width: min(100%, 680px);
        padding: clamp(24px, 6vw, 56px);
        border: 1px solid #333;
        background: #090909;
        box-shadow: 0 24px 80px #000;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #7d7d7d;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #fff;
        font-size: clamp(2rem, 9vw, 4rem);
        font-weight: 500;
        letter-spacing: -0.06em;
        line-height: 1;
        overflow-wrap: anywhere;
      }

      .summary {
        max-width: 58ch;
        margin: 24px 0 0;
        color: #aaa;
        font-size: clamp(1rem, 2.5vw, 1.125rem);
      }

      nav {
        margin-top: 36px;
      }

      ul {
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
        list-style: none;
      }

      a {
        color: #c7c7c7;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.22em;
        overflow-wrap: anywhere;
      }

      a:hover {
        color: #fff;
      }

      a:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 4px;
      }

      .primary {
        display: block;
        padding: 16px 18px;
        border: 1px solid #888;
        color: #fff;
        text-decoration: none;
      }

      .primary:hover {
        border-color: #fff;
        background: #141414;
      }

      .destination {
        display: block;
        margin-top: 4px;
        color: #888;
        font-size: 0.75rem;
        font-weight: 400;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }

      .secondary {
        margin-top: 8px;
        padding-left: 2px;
      }

      @media (max-width: 360px) {
        body {
          padding: 12px;
        }

        main {
          padding: 24px 18px;
        }

        .primary {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Historical site</p>
      <h1>Orrery3D has moved</h1>
      <p class="summary">
        The 3D view is now part of Orrery, alongside the original 2D view.
        This standalone site is no longer maintained.
      </p>

      <nav aria-label="Orrery destinations">
        <ul>
          <li>
            <a class="primary" href="https://sn3p.github.io/Orrery/?renderer=three">
              Open Orrery in 3D
              <span class="destination">sn3p.github.io/Orrery/?renderer=three</span>
            </a>
          </li>
          <li class="secondary">
            <a href="https://sn3p.github.io/Orrery/">Open Orrery in 2D</a>
          </li>
          <li class="secondary">
            <a href="https://github.com/sn3p/Orrery3D">View the historical source</a>
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
