name: GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Retain up to 100 pending updates without interrupting the active deployment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  browser-tests:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            install: chrome
            headless: "0"
          - browser: firefox
            install: firefox
            headless: "0"
          - browser: webkit
            install: webkit
            headless: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.install }}

      - name: Run browser regressions
        env:
          BROWSERS: ${{ matrix.browser }}
          # Chrome uses an X display for reliable surface screenshots;
          # Firefox requires it for WebGL 2 on the Linux runner.
          HEADLESS: ${{ matrix.headless }}
          # Use Mesa for reproducible software GL, including Chrome via ANGLE.
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p .context/test-logs
          set -o pipefail
          xvfb-run -a npm test 2>&1 | tee .context/test-logs/runner.log

      - name: Retain test results and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-tests-${{ matrix.browser }}
          path: |
            .context/tests/report/
            .context/test-logs/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site from source
        run: npm run build -- --output-clean

      - name: Upload site
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [build, browser-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
